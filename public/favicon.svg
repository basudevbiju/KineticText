<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <!-- Thermal Fire-to-Ice Gradient -->
    <linearGradient id="thermalArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="55%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="kGradient" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Hexagonal Chassis -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  
  <!-- Ambient Core Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#coreGlow)" />

  <!-- Dual Thermodynamic Orbital Rings -->
  <path d="M 18,18 A 20,20 0 0,1 46,18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 46,46 A 20,20 0 0,1 18,46" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  
  <!-- Orbital Nodes -->
  <circle cx="18" cy="18" r="2.5" fill="#f59e0b" />
  <circle cx="46" cy="46" r="2.5" fill="#06b6d4" />

  <!-- Stylized Kinetic "K" Reactor Core -->
  <path d="M 24,19 L 24,45 M 24,32 L 39,19 M 29,28 L 41,45" 
        stroke="url(#kGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Central Energy Spark -->
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
